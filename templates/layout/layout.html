<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>
        {% block title %}
        {% endblock title %}
    </title>
    {% block Style %}
    {% endblock Style %}
</head>
<body>
  {% if request.path != '/dashboard/' %}

<nav class="bg-white dark:bg-gray-900 fixed w-full z-20 top-0 start-0 border-b border-gray-200 dark:border-gray-600">
  <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
  <a href="https://flowbite.com/" class="flex items-center space-x-3 rtl:space-x-reverse">
      <img src="https://flowbite.com/docs/images/logo.svg" class="h-8" alt="Flowbite Logo">
      <span class="self-center text-2xl font-semibold whitespace-nowrap dark:text-white">Virtual Vidya</span>
  </a>
 

  {% if request.path != '/login/' and request.path != '/register/' %}
  <div class="order-2 flex gap-3 md:order-3">
      <a href="register" class="px-4 py-2 bg-orange-500 hover:bg-orange-600 text-gray-50 rounded-xl flex items-center gap-2">
        
          <span>Register</span>
      </a>
      <a href="login" class="px-4 py-2 bg-orange-500 hover:bg-orange-600 text-gray-50 rounded-xl flex items-center gap-2">

          <span>Login</span>
      </a>
  </div>
  {% endif %}
  
  <div class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1" id="navbar-sticky">

  </div>
  </div>
</nav>
{% endif %}


    
    {% block content %}
    {% endblock content %}

 
    <hr class="border-gray-200 sm:mx-auto dark:border-gray-700" />




</body>
</html>
